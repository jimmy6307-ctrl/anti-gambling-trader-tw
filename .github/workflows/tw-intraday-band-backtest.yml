name: Taiwan Intraday Research

on:
  push:
    branches:
      - backtest-intraday-bands-20260819
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib tabulate

      - name: Run original one-year band backtest
        run: |
          python research/tw_intraday_band_backtest.py \
            --start 2025-04-01 \
            --end 2026-04-01 \
            --rvol 1.5 \
            --top-sectors 3 \
            --min-breadth 2 \
            --out-dir research_output/tw_intraday_bands

      - name: Run frozen breakout IS/OOS research
        run: python research/tw_breakout_oos_research.py

      - name: Run breakout market-regime research
        run: python research/tw_breakout_regime_research.py

      - name: Print reports
        if: always()
        run: |
          echo '===== original band report ====='
          cat research_output/tw_intraday_bands/report.md || true
          echo '===== breakout OOS report ====='
          cat research_output/tw_breakout_oos/report.md || true
          echo '===== breakout regime report ====='
          cat research_output/tw_breakout_regime/report.md || true

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-intraday-research-results
          path: research_output/
          if-no-files-found: warn
          retention-days: 7
