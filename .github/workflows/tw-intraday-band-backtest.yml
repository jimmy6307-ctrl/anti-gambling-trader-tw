name: Taiwan Intraday Band Backtest

on:
  push:
    branches:
      - backtest-intraday-bands-20260819
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests matplotlib tabulate

      - name: Run one-year 5m backtest
        run: |
          python research/tw_intraday_band_backtest.py \
            --start 2025-04-01 \
            --end 2026-04-01 \
            --rvol 1.5 \
            --top-sectors 3 \
            --min-breadth 2 \
            --out-dir research_output/tw_intraday_bands

      - name: Print report
        if: always()
        run: |
          echo '===== report.md ====='
          cat research_output/tw_intraday_bands/report.md || true
          echo '===== summary.csv ====='
          cat research_output/tw_intraday_bands/summary.csv || true

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-intraday-band-backtest-results
          path: research_output/tw_intraday_bands/
          if-no-files-found: warn
          retention-days: 7
